name: workshop3

services:
  # ─── Personne B ────────────────────────────────────────────
  reverse-proxy:
    image: nginx:${NGINX_VERSION:-1.28.0-alpine}
    container_name: w3-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80" # seul port exposé à l'extérieur
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      - front_users
      - front_admin
      - api

  front_users:
    image: nginx:${NGINX_VERSION:-1.28.0-alpine}
    container_name: w3-front-users
    restart: unless-stopped
    volumes:
      - ./front_users:/usr/share/nginx/html:ro
    networks:
      - frontend

  front_admin:
    image: nginx:${NGINX_VERSION:-1.28.0-alpine}
    container_name: w3-front-admin
    restart: unless-stopped
    volumes:
      - ./front_admin:/usr/share/nginx/html:ro
    networks:
      - frontend

  api:
    build: ./api
    image: workshop3-api:${API_VERSION:-1.0.0}
    platform: linux/amd64
    container_name: w3-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${MYSQL_DATABASE:-adresses}
      PORT: 3000
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4@sha256:2068651a18ac6048578647ea57b940ca2daed3f504ebe7fba6a93beeb39aaa1f # v8.4.13 linux/amd64
    platform: linux/amd64
    container_name: w3-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-adresses}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    volumes:
      - db-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  frontend: # reverse-proxy <-> fronts <-> api
  backend: # api <-> db (la base n'est joignable que par l'API)

volumes:
  db-data:
