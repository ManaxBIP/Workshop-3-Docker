server {
    listen 80;
    server_name _;

    # Routes admin de l'API : protégées par le même identifiant que le front admin.
    # Regex insensible à la casse (~*) car Express ignore la casse des routes :
    # sans ça, /api/Admin/adresses passerait par /api/ sans authentification.
    location ~* ^/api/admin {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://front_admin:80/;
        proxy_set_header Host $host;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        proxy_pass http://front_users:80;
        proxy_set_header Host $host;
    }
}
