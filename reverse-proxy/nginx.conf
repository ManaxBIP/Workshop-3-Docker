server {
    listen 80;
    server_name _;

    # API : le préfixe /api est conservé (l'API définit ses routes sous /api/...)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Front administrateur : le "/" final retire le préfixe /admin/
    # (/admin/app.js -> front_admin:/app.js)
    location /admin/ {
        proxy_pass http://front_admin:80/;
        proxy_set_header Host $host;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Front utilisateurs (par défaut)
    location / {
        proxy_pass http://front_users:80;
        proxy_set_header Host $host;
    }
}
