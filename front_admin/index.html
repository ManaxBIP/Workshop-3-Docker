<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration des adresses</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <main class="max-w-2xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold mb-6">Administration : nouvelle adresse</h1>

    <form id="form-adresse" class="bg-white rounded-lg shadow p-6 grid gap-4 sm:grid-cols-2">
      <input name="numero_rue" placeholder="Numéro" required
        class="border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input name="nom_rue" placeholder="Nom de la rue" required
        class="border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input name="code_postal" placeholder="Code postal" required
        class="border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input name="ville" placeholder="Ville" required
        class="border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button type="submit"
        class="sm:col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded px-4 py-2">
        Créer
      </button>
    </form>
    <p id="message" class="mt-4"></p>

    <h2 class="text-xl font-semibold mt-10 mb-4">Adresses existantes</h2>
    <p id="etat" class="text-slate-500">Chargement…</p>
    <ul id="liste-adresses" class="bg-white rounded-lg shadow divide-y divide-slate-100" hidden></ul>
  </main>

  <!-- Chemins RELATIFS (sans "/" au début) : le front est servi sous /admin/ -->
  <script src="app.js"></script>
</body>
</html>
